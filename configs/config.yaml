# CV Hackathon 2026 - P5 Project Configuration
project:
  name: "P5-Intelligent-Vehicle-Recognition"
  version: "1.0.0"
  seed: 42

dataset:
  name: "Stanford Cars (Cars196)"
  # Configurable root directory; can be overridden via STANFORD_CARS_ROOT or DATASET_ROOT env vars
  root_dir: "Stanford Dataset"
  raw_dir: "Stanford Dataset"
  processed_dir: "data/processed"
  metadata_dir: "data/metadata"
  reports_dir: "data/reports"
  manifest_csv: "data/processed/metadata/vehicle_manifest.csv"
  manifest_json: "data/processed/metadata/vehicle_manifest.json"
  splits_dir: "data/splits"
  train_split: "data/splits/train.csv"
  val_split: "data/splits/validation.csv"
  test_split: "data/splits/test.csv"
  detection_dir: "data/processed/detection"
  detection_yaml: "data/processed/detection/dataset.yaml"
  num_classes: 196
  num_makes: 49
  expected_train_images: 8144
  expected_test_images: 8041
  expected_total_images: 16185
  train_split_ratio: 0.85
  val_split_ratio: 0.15

preprocessing:
  image_size: [224, 224]  # [width, height]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  canny_low_thresh: 50
  canny_high_thresh: 150

augmentation:
  random_horizontal_flip_p: 0.5
  rotation_degrees: 15
  random_crop_scale: [0.8, 1.0]
  color_jitter:
    brightness: 0.15
    contrast: 0.15
    saturation: 0.15
    hue: 0.05
  gaussian_blur_p: 0.2
  gaussian_noise_p: 0.1
  perspective_p: 0.1

hardware:
  device: "auto"  # "auto", "cuda", or "cpu"
  mixed_precision: true
  num_workers: 2
  batch_size: 32
  max_vram_gb: 5.2  # GPU memory budget (NVIDIA RTX 3050 Laptop 6GB)

inference:
  detection_conf_thresh: 0.45
  classification_conf_thresh: 0.50
  rejection_thresh: 0.45
  temperature: 1.2

classical_cv:
  roi:
    target_size: [128, 128]  # [width, height]
    keep_aspect_ratio: true
    padding_ratio: 0.05
    use_bbox: true
  hog:
    orientations: 9
    pixels_per_cell: [8, 8]
    cells_per_block: [2, 2]
    block_norm: "L2-Hys"
    transform_sqrt: true
  color:
    color_spaces: ["hsv", "rgb"]
    bins_per_channel: 16
    norm: "l2"
  lbp:
    radius: 2
    n_points: 16
    method: "uniform"
    grid: [4, 4]
  orb:
    n_features: 500
    scale_factor: 1.2
    n_levels: 8
    vocab_size: 100
    max_descriptors_for_vocab: 50000
  feature_fusion:
    default_config: "hog_color_lbp"
    use_scaler: true
    use_pca: true
    pca_components: 128
    cache_dir: "data/cache/classical_features"
  classifier:
    default_type: "linear_svm"
    svm_c: 1.0
    svm_kernel: "linear"
    calibrate_svm: true
    rf_n_estimators: 100
    rf_max_depth: 25
    rf_min_samples_leaf: 2
  paths:
    models_dir: "models/classical"
    outputs_dir: "outputs/classical_cv"


